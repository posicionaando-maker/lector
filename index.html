<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buscador de Libros · Desarrollo Personal | PWA</title>
    <meta name="description" content="Busca libros de desarrollo personal, autocompletado inteligente, análisis offline y audio.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%235C4A7C'/%3E%3Cpath fill='%23FFB74D' d='M30 45 L70 45 L65 70 L35 70 Z M48 30 L52 30 L52 45 L48 45 Z'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%235C4A7C'/%3E%3Cpath fill='%23FFB74D' d='M30 45 L70 45 L65 70 L35 70 Z M48 30 L52 30 L52 45 L48 45 Z'/%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #F5F3F7;
            color: #2D2A3A;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #5C4A7C 0%, #3D2A5C 100%);
            padding: 1.8rem;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.2rem; }
        .offline-badge {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }
        .content { padding: 1.8rem; }
        .search-section {
            background: #F0EEF5;
            border-radius: 28px;
            padding: 1.3rem;
            margin-bottom: 1.5rem;
        }
        .search-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .search-group input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid #DDD6E8;
            border-radius: 60px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            background: white;
        }
        .search-group input:focus { border-color: #5C4A7C; }
        .search-group button {
            background: #5C4A7C;
            border: none;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .suggestions-hint {
            font-size: 0.7rem;
            color: #6B5E7E;
            margin-top: 0.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .suggestion-chip {
            background: white;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid #DDD6E8;
        }
        .results-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 1.3rem;
            margin: 1rem 0;
            border-left: 5px solid #5C4A7C;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .book-title-display {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3D2A5C;
            margin-bottom: 1rem;
            word-break: break-word;
        }
        .tematica, .beneficios, .plan-accion {
            margin-bottom: 1rem;
        }
        .tematica h4, .beneficios h4, .plan-accion h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5C4A7C;
            margin-bottom: 0.3rem;
        }
        .audio-bar {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid #E8E4F0;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        button {
            background: #5C4A7C;
            border: none;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            cursor: pointer;
        }
        .btn-stop { background: #B86B8F; }
        .preferencias {
            background: #F0EEF5;
            border-radius: 20px;
            padding: 1rem;
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1rem;
            color: #8E82A3;
            border-top: 1px solid #E8E4F0;
        }
        @media (max-width: 550px) {
            body { padding: 0.8rem; }
            .book-title-display { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🔍 Buscador de libros</h1>
        <p>Desarrollo personal · Autocompletar inteligente</p>
        <div class="offline-badge" id="statusConexion">🟢 En línea</div>
    </div>
    <div class="content">
        <div class="search-section">
            <div class="search-group">
                <input type="text" id="buscadorInput" placeholder="Escribe el título... (ej: hábitos, monje, padre rico)" autocomplete="off" list="listaAutocompletar">
                <button id="buscarBtn">🔍 Buscar / Analizar</button>
            </div>
            <div class="suggestions-hint" id="sugerenciasRapidas">
                ⚡ Sugerencias:
                <span class="suggestion-chip" data-libro="Los 7 hábitos de la gente altamente efectiva">Hábitos</span>
                <span class="suggestion-chip" data-libro="El monje que vendió su Ferrari">Monje Ferrari</span>
                <span class="suggestion-chip" data-libro="Padre rico, padre pobre">Padre rico</span>
                <span class="suggestion-chip" data-libro="Rompe la barrera de tus creencias">Creencias</span>
            </div>
        </div>

        <!-- Datalist para autocompletado (se genera desde JS) -->
        <datalist id="listaAutocompletar"></datalist>

        <div class="results-card">
            <div class="book-title-display" id="resultTitle">—</div>
            <div class="tematica"><h4>🎯 Temática principal</h4><p id="tematicaText">—</p></div>
            <div class="beneficios"><h4>✅ Beneficios que aporta</h4><p id="beneficiosText">—</p></div>
            <div class="plan-accion"><h4>📋 Plan de acción breve</h4><p id="planText">—</p></div>
            <div class="audio-bar">
                <button id="btnAudio">🔊 Escuchar análisis</button>
                <button id="btnStopAudio" class="btn-stop">⏹️ Detener</button>
            </div>
        </div>

        <div class="preferencias">
            <span>📖 Modo:</span>
            <label><input type="radio" name="modoTexto" value="normal" checked> Normal</label>
            <label><input type="radio" name="modoTexto" value="grande"> Texto grande</label>
            <button id="guardarModo">Guardar</button>
            <span id="prefMsg" style="font-size:0.7rem;">⚡</span>
        </div>
        <footer>📚 Offline: lista de libros guardada · Instálala como app</footer>
    </div>
</div>

<script>
    (function() {
        // ---------- BASE DE DATOS DE LIBROS (30+ títulos populares) ----------
        const LIBROS_DATABASE = [
            "Los 7 hábitos de la gente altamente efectiva",
            "El monje que vendió su Ferrari",
            "Padre rico, padre pobre",
            "Rompe la barrera de tus creencias",
            "Cómo ganar amigos e influir sobre las personas",
            "Piense y hágase rico",
            "El poder del ahora",
            "La inteligencia emocional",
            "Hábitos atómicos",
            "El secreto",
            "Despertando al gigante interior",
            "Tus zonas erróneas",
            "El hombre en busca de sentido",
            "La semana laboral de 4 horas",
            "Gritar no es educar",
            "Mindset: La actitud del éxito",
            "Vivir con plenitud las crisis",
            "El arte de no amargarse la vida",
            "Los cuatro acuerdos",
            "El milagro del mindfulness",
            "La magia del orden",
            "El código del dinero",
            "Neuromarketing en acción",
            "El método ikigai",
            "La felicidad después del dolor",
            "Trabajo profundo",
            "Esencialismo",
            "La ventaja del ganador",
            "El coraje de no gustar"
        ];
        
        // Guardar en localStorage para offline
        if (!localStorage.getItem('libros_db')) {
            localStorage.setItem('libros_db', JSON.stringify(LIBROS_DATABASE));
        }
        
        // Función para obtener lista (offline-safe)
        function obtenerListaLibros() {
            const stored = localStorage.getItem('libros_db');
            if (stored) return JSON.parse(stored);
            return LIBROS_DATABASE;
        }
        
        let listaActiva = obtenerListaLibros();
        
        // ---------- POBLAR DATALIST (autocompletar nativo) ----------
        const datalist = document.getElementById('listaAutocompletar');
        function actualizarDatalist() {
            datalist.innerHTML = '';
            listaActiva.forEach(libro => {
                const option = document.createElement('option');
                option.value = libro;
                datalist.appendChild(option);
            });
        }
        actualizarDatalist();
        
        // ---------- NORMALIZACIÓN Y DETECCIÓN FLEXIBLE ----------
        function normalizar(texto) {
            return texto.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, '')
                .trim();
        }
        
        // Encontrar el libro más similar en la base (si existe) usando coincidencia parcial
        function encontrarLibroEnBase(tituloIngresado) {
            const normInput = normalizar(tituloIngresado);
            if (!normInput) return null;
            // Primero buscar coincidencia exacta después de normalizar
            for (let libro of listaActiva) {
                if (normalizar(libro) === normInput) return libro;
            }
            // Búsqueda por palabras clave (si al menos 2 palabras coinciden)
            const palabrasInput = normInput.split(/\s+/).filter(p => p.length > 2);
            let mejorMatch = null;
            let maxPuntuacion = 0;
            for (let libro of listaActiva) {
                const normLibro = normalizar(libro);
                let puntuacion = 0;
                for (let palabra of palabrasInput) {
                    if (normLibro.includes(palabra)) puntuacion++;
                }
                if (puntuacion > maxPuntuacion && puntuacion >= 1) {
                    maxPuntuacion = puntuacion;
                    mejorMatch = libro;
                }
            }
            return mejorMatch;
        }
        
        // ---------- GENERACIÓN DE CONTENIDO (temática, beneficios, plan) ----------
        function generarContenidoPorTitulo(titulo) {
            const norm = normalizar(titulo);
            // Patrones
            if (norm.includes("habitos") || norm.includes("habito") || norm.includes("efectiva")) {
                return {
                    tematica: "Proactividad, administración del tiempo, liderazgo basado en principios y carácter.",
                    beneficios: "Aumenta productividad, mejora relaciones, reduce estrés y fortalece la integridad personal.",
                    plan: "1. Redacta tu misión personal. 2. Prioriza lo importante no urgente cada día. 3. Practica escucha activa en 3 conversaciones."
                };
            } else if (norm.includes("monje") || norm.includes("ferrari")) {
                return {
                    tematica: "Transformación interior, disciplina mental, simplicidad y búsqueda de la felicidad duradera.",
                    beneficios: "Reduce ansiedad, clarifica propósito, mejora hábitos cotidianos y equilibrio espiritual.",
                    plan: "1. Medita 10 min diarios. 2. Elimina una distracción digital. 3. Realiza un acto de servicio anónimo."
                };
            } else if (norm.includes("padre") && (norm.includes("rico") || norm.includes("pobre"))) {
                return {
                    tematica: "Educación financiera, mentalidad de abundancia, activos vs pasivos y libertad económica.",
                    beneficios: "Desarrolla inteligencia financiera, genera ingresos pasivos y cambia creencias limitantes.",
                    plan: "1. Compra un pequeño activo. 2. Estudia finanzas 20 min/día. 3. Enseña un concepto financiero a alguien."
                };
            } else if (norm.includes("creencia") || norm.includes("barrera") || norm.includes("limitante")) {
                return {
                    tematica: "Creencias limitantes, neuroplasticidad, superación de patrones mentales tóxicos.",
                    beneficios: "Libera potencial oculto, aumenta autoconfianza y reprograma la mente para el éxito.",
                    plan: "1. Identifica una creencia limitante. 2. Sustitúyela con afirmaciones diarias. 3. Actúa enfrentando un miedo pequeño."
                };
            } else {
                return {
                    tematica: `Análisis de "${titulo}": crecimiento personal, autoconocimiento, resiliencia y transformación de hábitos.`,
                    beneficios: "Claridad mental, mejora en decisiones, motivación sostenible y herramientas prácticas.",
                    plan: "1. Extrae 3 ideas clave. 2. Crea un diario de progreso semanal. 3. Comprométete con un cambio 21 días."
                };
            }
        }
        
        // Mostrar contenido en DOM y guardar en localStorage
        let currentTitle = "";
        function mostrarAnalisis(titulo) {
            if (!titulo || titulo.trim() === "") return;
            currentTitle = titulo;
            const contenido = generarContenidoPorTitulo(titulo);
            document.getElementById('resultTitle').innerText = titulo;
            document.getElementById('tematicaText').innerText = contenido.tematica;
            document.getElementById('beneficiosText').innerText = contenido.beneficios;
            document.getElementById('planText').innerText = contenido.plan;
            // Guardar último para offline
            localStorage.setItem('ultimo_titulo', titulo);
            localStorage.setItem('ultimo_contenido', JSON.stringify(contenido));
        }
        
        // Cargar último offline
        function cargarUltimoOffline() {
            const ultTitulo = localStorage.getItem('ultimo_titulo');
            const ultContenido = localStorage.getItem('ultimo_contenido');
            if (ultTitulo && ultContenido) {
                document.getElementById('resultTitle').innerText = ultTitulo;
                const cont = JSON.parse(ultContenido);
                document.getElementById('tematicaText').innerText = cont.tematica;
                document.getElementById('beneficiosText').innerText = cont.beneficios;
                document.getElementById('planText').innerText = cont.plan;
                document.getElementById('buscadorInput').value = ultTitulo;
                currentTitle = ultTitulo;
            } else {
                mostrarAnalisis("Los 7 hábitos de la gente altamente efectiva");
                document.getElementById('buscadorInput').value = "Los 7 hábitos de la gente altamente efectiva";
            }
        }
        
        // Función principal de búsqueda + autocompletado tolerante
        function buscarYAnalizar() {
            let entrada = document.getElementById('buscadorInput').value.trim();
            if (entrada === "") return;
            // Intentar encontrar el libro en la base (coincidencia flexible)
            const libroEncontrado = encontrarLibroEnBase(entrada);
            if (libroEncontrado) {
                mostrarAnalisis(libroEncontrado);
                document.getElementById('buscadorInput').value = libroEncontrado;
                document.getElementById('prefMsg').innerText = '✅ Coincidencia exacta';
            } else {
                // Si no está en la base, analizar igualmente el texto ingresado
                mostrarAnalisis(entrada);
                document.getElementById('prefMsg').innerText = '📖 Análisis genérico';
            }
            setTimeout(() => {
                if (document.getElementById('prefMsg').innerText.includes('✅') || document.getElementById('prefMsg').innerText.includes('📖'))
                    document.getElementById('prefMsg').innerText = '⚡';
            }, 2000);
        }
        
        // ---------- AUDIO ----------
        const synth = window.speechSynthesis;
        let utteranceActual = null;
        function obtenerTextoAudio() {
            const tit = document.getElementById('resultTitle').innerText;
            const tem = document.getElementById('tematicaText').innerText;
            const ben = document.getElementById('beneficiosText').innerText;
            const plan = document.getElementById('planText').innerText;
            let texto = `Libro: ${tit}. Temática: ${tem}. Beneficios: ${ben}. Plan de acción: ${plan}`;
            if (texto.length > 500) texto = texto.substring(0, 497)+"...";
            return texto;
        }
        function hablar() {
            if (synth.speaking || synth.pending) synth.cancel();
            const texto = obtenerTextoAudio();
            if (!texto) return;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 0.92;
            utterance.onend = () => { utteranceActual = null; };
            utteranceActual = utterance;
            synth.speak(utterance);
            document.getElementById('prefMsg').innerText = '🔊 Reproduciendo';
            setTimeout(() => { if(document.getElementById('prefMsg').innerText === '🔊 Reproduciendo') document.getElementById('prefMsg').innerText = '⚡'; }, 3000);
        }
        function detener() {
            if (synth.speaking || synth.pending) {
                synth.cancel();
                document.getElementById('prefMsg').innerText = '⏹️ Detenido';
                setTimeout(() => { if(document.getElementById('prefMsg').innerText === '⏹️ Detenido') document.getElementById('prefMsg').innerText = '⚡'; }, 1200);
            }
        }
        document.getElementById('btnAudio').addEventListener('click', hablar);
        document.getElementById('btnStopAudio').addEventListener('click', detener);
        
        // ---------- MODO LECTURA ----------
        const modoRadios = document.querySelectorAll('input[name="modoTexto"]');
        const guardarModoBtn = document.getElementById('guardarModo');
        const textoElements = ['tematicaText', 'beneficiosText', 'planText', 'resultTitle'].map(id => document.getElementById(id));
        function aplicarModo(modo) {
            textoElements.forEach(el => {
                if (el.id === 'resultTitle') el.style.fontSize = modo === 'grande' ? '1.8rem' : '';
                else el.style.fontSize = modo === 'grande' ? '1.15rem' : '';
            });
        }
        const modoGuardado = localStorage.getItem('modo_lectura_libros');
        if (modoGuardado === 'grande') {
            document.querySelector('input[value="grande"]').checked = true;
            aplicarModo('grande');
        } else aplicarModo('normal');
        
        guardarModoBtn.addEventListener('click', () => {
            const modo = document.querySelector('input[name="modoTexto"]:checked').value;
            localStorage.setItem('modo_lectura_libros', modo);
            aplicarModo(modo);
            document.getElementById('prefMsg').innerText = '✅ Modo guardado';
            setTimeout(() => { if(document.getElementById('prefMsg').innerText === '✅ Modo guardado') document.getElementById('prefMsg').innerText = '⚡'; }, 1500);
        });
        
        // ---------- EVENTOS ----------
        document.getElementById('buscarBtn').addEventListener('click', buscarYAnalizar);
        document.getElementById('buscadorInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') buscarYAnalizar(); });
        // Sugerencias rápidas
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const libro = chip.getAttribute('data-libro');
                document.getElementById('buscadorInput').value = libro;
                buscarYAnalizar();
            });
        });
        
        // ---------- SERVICE WORKER OFFLINE ----------
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'autocompletar-pwa-v1';
                self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', self.location.origin + '/']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => {
                    if(e.request.mode === 'navigate') return caches.match('./');
                    return new Response('Offline', {status:404});
                }))));
                self.addEventListener('activate', e => e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE && caches.delete(k))))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e => console.warn);
        }
        
        // ---------- MANIFEST ----------
        const manifest = {
            name: "Buscador de Libros · Desarrollo Personal",
            short_name: "Libros PWA",
            start_url: "./",
            display: "standalone",
            theme_color: "#5C4A7C",
            background_color: "#F5F3F7",
            icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%235C4A7C'/%3E%3Cpath fill='%23FFB74D' d='M30 45 L70 45 L65 70 L35 70 Z M48 30 L52 30 L52 45 L48 45 Z'/%3E%3C/svg%3E", sizes: "any", type: "image/svg+xml" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(linkManifest);
        
        // Inicializar
        cargarUltimoOffline();
        
        // Estado conexión
        window.addEventListener('online', () => document.getElementById('statusConexion').innerHTML = '🟢 En línea');
        window.addEventListener('offline', () => document.getElementById('statusConexion').innerHTML = '📴 Offline (búsqueda local)');
    })();
</script>
</body>
</html>
